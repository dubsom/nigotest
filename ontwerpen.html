<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontwerp je kaartje | WoodCard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f0e8;
      color: #2d241d;
    }

    header {
      background: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    header a {
      color: #2d241d;
      text-decoration: none;
      font-weight: bold;
    }

    .title {
      text-align: center;
      padding: 50px 20px 10px;
    }

    .title h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .title p {
      color: #6b5c51;
      font-size: 18px;
    }

    .designer {
      max-width: 1200px;
      margin: auto;
      padding: 40px 5% 80px;

      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 50px;
    }

    .panel {
      background: white;
      padding: 28px;
      border-radius: 14px;
    }

    .panel h2 {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfc5bb;
      border-radius: 7px;
      font-size: 16px;
    }

    .preview {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview h2 {
      margin-bottom: 25px;
    }

    .card {
      width: 510px;
      height: 330px;

      background-color: #d8b07a;

      background-image:
        repeating-linear-gradient(
          4deg,
          rgba(70, 40, 20, 0.04) 0px,
          rgba(70, 40, 20, 0.04) 1px,
          transparent 1px,
          transparent 7px
        );

      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.20);

      padding: 45px;

      position: relative;
      overflow: hidden;
    }

    .card-name {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .card-company {
      font-size: 19px;
      margin-bottom: 65px;
    }

    .contact {
      font-size: 16px;
      line-height: 1.8;
    }

    .qr {
      position: absolute;
      right: 35px;
      bottom: 35px;

      width: 85px;
      height: 85px;

      border: 3px solid #2d241d;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: bold;
    }

    .order-box {
      width: 510px;
      margin-top: 30px;

      background: white;
      padding: 25px;

      border-radius: 14px;
    }

    .selection {
      color: #6b5c51;
      margin-top: 8px;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin-top: 20px;
    }

    .button {
      display: inline-block;

      margin-top: 20px;

      background: #3d2a1e;
      color: white;

      padding: 15px 30px;

      border-radius: 8px;

      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #604532;
    }

    @media (max-width: 850px) {

      .designer {
        grid-template-columns: 1fr;
      }

      .card,
      .order-box {
        width: 100%;
        max-width: 510px;
      }

      .card {
        height: 310px;
      }

      .title h1 {
        font-size: 34px;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="logo">
    WOODCARD
  </div>

  <a href="index.html">
    ← Terug naar home
  </a>

</header>


<section class="title">

  <h1>Ontwerp je houten kaartje</h1>

  <p>
    Vul je gegevens in en bekijk direct het resultaat.
  </p>

</section>


<main class="designer">


  <!-- LINKERKANT -->

  <section class="panel">

    <h2>Jouw gegevens</h2>


    <label for="naam">
      Naam
    </label>

    <input
      type="text"
      id="naam"
      value="Jan Peeters"
    >


    <label for="bedrijf">
      Bedrijf / functie
    </label>

    <input
      type="text"
      id="bedrijf"
      value="JP Houtwerken"
    >


    <label for="telefoon">
      Telefoon
    </label>

    <input
      type="text"
      id="telefoon"
      value="0470 12 34 56"
    >


    <label for="email">
      E-mail
    </label>

    <input
      type="email"
      id="email"
      value="jan@jphout.be"
    >


    <label for="website">
      Website
    </label>

    <input
      type="text"
      id="website"
      value="www.jphout.be"
    >


    <label for="hout">
      Houtsoort
    </label>

    <select id="hout">

      <option
        value="#d8b07a"
        data-name="Esdoorn"
      >
        Esdoorn
      </option>

      <option
        value="#9a6748"
        data-name="Walnoot"
      >
        Walnoot
      </option>

      <option
        value="#c99b5d"
        data-name="Bamboe"
      >
        Bamboe
      </option>

    </select>


    <label for="aantal">
      Aantal kaartjes
    </label>

    <select id="aantal">

      <option value="25">
        25 kaartjes
      </option>

      <option value="50">
        50 kaartjes
      </option>

      <option value="100" selected>
        100 kaartjes
      </option>

      <option value="250">
        250 kaartjes
      </option>

    </select>

  </section>



  <!-- RECHTERKANT -->

  <section class="preview">

    <h2>Live voorbeeld</h2>


    <div class="card" id="kaart">

      <div
        class="card-name"
        id="voorbeeldNaam"
      >
        Jan Peeters
      </div>


      <div
        class="card-company"
        id="voorbeeldBedrijf"
      >
        JP Houtwerken
      </div>


      <div class="contact">

        <div id="voorbeeldTelefoon">
          0470 12 34 56
        </div>

        <div id="voorbeeldEmail">
          jan@jphout.be
        </div>

        <div id="voorbeeldWebsite">
          www.jphout.be
        </div>

      </div>


      <div class="qr">
        QR
      </div>

    </div>



    <div class="order-box">

      <strong>
        Jouw keuze
      </strong>

      <div
        class="selection"
        id="samenvatting"
      >
        Esdoorn • 100 kaartjes
      </div>


      <div
        class="price"
        id="prijs"
      >
        €59
      </div>


      <a
        href="#"
        class="button"
      >
        Bestellen →
      </a>

    </div>

  </section>

</main>



<script>

  const naam =
    document.getElementById("naam");

  const bedrijf =
    document.getElementById("bedrijf");

  const telefoon =
    document.getElementById("telefoon");

  const email =
    document.getElementById("email");

  const website =
    document.getElementById("website");

  const hout =
    document.getElementById("hout");

  const aantal =
    document.getElementById("aantal");


  function updateKaart() {

    document.getElementById(
      "voorbeeldNaam"
    ).textContent = naam.value;


    document.getElementById(
      "voorbeeldBedrijf"
    ).textContent = bedrijf.value;


    document.getElementById(
      "voorbeeldTelefoon"
    ).textContent = telefoon.value;


    document.getElementById(
      "voorbeeldEmail"
    ).textContent = email.value;


    document.getElementById(
      "voorbeeldWebsite"
    ).textContent = website.value;


    const kaart =
      document.getElementById("kaart");

    kaart.style.backgroundColor =
      hout.value;


    const houtNaam =
      hout.options[
        hout.selectedIndex
      ].dataset.name;


    const aantalKaarten =
      Number(aantal.value);


    document.getElementById(
      "samenvatting"
    ).textContent =
      houtNaam +
      " • " +
      aantalKaarten +
      " kaartjes";


    let prijs = 29;


    if (aantalKaarten === 50) {
      prijs = 39;
    }


    if (aantalKaarten === 100) {
      prijs = 59;
    }


    if (aantalKaarten === 250) {
      prijs = 109;
    }


    document.getElementById(
      "prijs"
    ).textContent =
      "€" + prijs;

  }


  naam.addEventListener(
    "input",
    updateKaart
  );

  bedrijf.addEventListener(
    "input",
    updateKaart
  );

  telefoon.addEventListener(
    "input",
    updateKaart
  );

  email.addEventListener(
    "input",
    updateKaart
  );

  website.addEventListener(
    "input",
    updateKaart
  );

  hout.addEventListener(
    "change",
    updateKaart
  );

  aantal.addEventListener(
    "change",
    updateKaart
  );


  updateKaart();

</script>

</body>
</html>
